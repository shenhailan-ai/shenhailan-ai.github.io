name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The built-in Pages workflow is dynamic. Poll its exact commit through the
      # Actions API, then compare public content, instead of assuming an event name.
      - name: Wait for successful Pages deployment and notify canonical pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/notify_indexnow.py
